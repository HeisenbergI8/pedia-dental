# Local MySQL for apps/api. `pnpm --filter api db:up`. Port 3307 so it never clashes with a Homebrew MySQL on 3306.
services:
  mysql:
    image: mysql:8.4
    container_name: pedia-dental-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedia_dental
      MYSQL_USER: pedia
      MYSQL_PASSWORD: pedia
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
