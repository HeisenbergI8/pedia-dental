# Deploy the API to Google Cloud (Cloud Run). Run by hand: Actions → deploy → Run workflow, on master.
# Before the first run: packages/infra/runbooks/first-time-setup.md. Each run: packages/infra/runbooks/deploy.md.
# Signs in with GitHub OIDC through Workload Identity Federation as primolar-deploy (no stored Google keys). The
# `production` environment's variables: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT.
# Never runs Terraform (the owner does, by hand): it changes only the image of the release job and of the service.
name: deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: redeploy an image already in Artifact Registry (its commit SHA). Skips the build and the migrations. Empty = build and deploy this commit."
        required: false
        default: ""

permissions:
  id-token: write # OIDC
  contents: read
  actions: read # the green-check guard reads api.yml's runs

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      REGION: asia-southeast1
      REGISTRY: asia-southeast1-docker.pkg.dev
      IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/primolar/primolar-api
      SERVICE: primolar-api
      RELEASE_JOB: primolar-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pick the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "$INPUT_TAG" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::image_tag must be a commit SHA"; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a commit without a green check (api.yml)
        if: steps.tag.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --workflow api.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          test "$green" -gt 0 || { echo "::error::No successful 'check' run for $GITHUB_SHA. Wait for CI, or fix it first."; exit 1; }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sign Docker in to Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Rollback target exists in Artifact Registry
        if: steps.tag.outputs.build == 'false'
        run: gcloud artifacts docker images describe "$IMAGE:${{ steps.tag.outputs.tag }}" > /dev/null

      # Tags are immutable: a re-run for the same commit (after a later step failed) reuses its image, migrations included.
      - name: Image already pushed for this commit?
        id: pushed
        if: steps.tag.outputs.build == 'true'
        run: |
          if gcloud artifacts docker images describe "$IMAGE:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tag.outputs.build == 'true' && steps.pushed.outputs.exists != 'true'
      - name: Build and push the image
        if: steps.tag.outputs.build == 'true' && steps.pushed.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The first deploy pushes the image, then stops here: Terraform creates the service and the job with it.
      - name: The service and the release job exist
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gcloud run services describe "$SERVICE" --region "$REGION" --format='value(metadata.name)' > /dev/null 2>&1 \
            || ! gcloud run jobs describe "$RELEASE_JOB" --region "$REGION" --format='value(metadata.name)' > /dev/null 2>&1; then
            echo "::error::$SERVICE or $RELEASE_JOB doesn't exist yet. First deploy: the image $TAG is pushed. Now apply Terraform with -var initial_image_tag=$TAG (runbooks/first-time-setup.md), then run this workflow again."
            exit 1
          fi
          echo "Running now: $(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(spec.template.spec.containers[0].image)'). To roll back, run this workflow with that image's tag."

      - name: Run the release job (prisma migrate deploy)
        if: steps.tag.outputs.build == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gcloud run jobs update "$RELEASE_JOB" --region "$REGION" --image "$IMAGE:$TAG" --quiet
          if ! gcloud run jobs execute "$RELEASE_JOB" --region "$REGION" --wait --quiet; then
            echo "::error::The release job failed: migrations failed and the service was NOT updated. Read its log (Cloud Run → Jobs → $RELEASE_JOB → the newest execution), then runbooks/rollback.md."
            exit 1
          fi

      # Waits until the new revision passes /api/health/ready; if it never does, traffic stays on the old one.
      - name: Update the service to the new image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE:$TAG" --quiet
