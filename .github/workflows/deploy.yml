# Deploy the API to AWS (B13b). Run by hand: Actions → deploy → Run workflow, on master.
# Before the first run: packages/infra/runbooks/first-time-setup.md. Each run: packages/infra/runbooks/deploy.md.
# Signs in with GitHub OIDC as the deploy role from the foundation stack (no stored AWS keys). Its ARN is the
# `production` environment's variable AWS_DEPLOY_ROLE_ARN. Never deploys the foundation: that is done by hand.
name: deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: redeploy an image already in ECR (its commit SHA). Skips the build and the migrations. Empty = build and deploy this commit."
        required: false
        default: ""

permissions:
  id-token: write # OIDC
  contents: read
  actions: read # the green-check guard reads api.yml's runs

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AWS_REGION: ap-southeast-1
      REPOSITORY: primolar-api
      SERVICE_STACK: PrimolarService
    steps:
      - uses: actions/checkout@v4

      - name: Pick the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "$INPUT_TAG" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::image_tag must be a commit SHA"; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a commit without a green check (api.yml)
        if: steps.tag.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --workflow api.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          test "$green" -gt 0 || { echo "::error::No successful 'check' run for $GITHUB_SHA. Wait for CI, or fix it first."; exit 1; }

      - uses: pnpm/action-setup@v4 # version from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@pedia/infra..."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Rollback target exists in ECR
        if: steps.tag.outputs.build == 'false'
        run: aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag=${{ steps.tag.outputs.tag }} > /dev/null

      # ECR tags are immutable: a re-run for the same commit (after a later step failed) reuses its image, migrations included.
      - name: Image already pushed for this commit?
        id: pushed
        if: steps.tag.outputs.build == 'true'
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag=${{ steps.tag.outputs.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.build == 'true' && steps.pushed.outputs.exists != 'true'
      - name: Build and push the image
        if: steps.tag.outputs.build == 'true' && steps.pushed.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/primolar-api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read the tag the services run now
        id: current
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if out=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='ImageTagInUse'].OutputValue" --output text 2>&1); then
            # A first deploy that failed leaves the stack in ROLLBACK_COMPLETE, with no outputs.
            echo "$out" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::$SERVICE_STACK has no ImageTagInUse ('$out'): a failed first deploy? See runbooks/deploy.md, 'A first deploy that failed'."; exit 1; }
            echo "tag=$out" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "does not exist"; then
            echo "::notice::First deploy: $SERVICE_STACK is created with $TAG before its first migration (runbooks/deploy.md)."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; exit 1
          fi

      - name: Point the release task at the new image
        if: steps.tag.outputs.build == 'true'
        working-directory: packages/infra
        run: >-
          pnpm exec cdk deploy "$SERVICE_STACK" --exclusively --require-approval never
          --parameters "$SERVICE_STACK:ReleaseImageTag=${{ steps.tag.outputs.tag }}"
          --parameters "$SERVICE_STACK:ImageTag=${{ steps.current.outputs.tag }}"
          --outputs-file "$RUNNER_TEMP/outputs.json"

      - name: Run the release task (prisma migrate deploy)
        if: steps.tag.outputs.build == 'true'
        run: |
          out() { jq -r --arg key "$1" '.PrimolarService[$key]' "$RUNNER_TEMP/outputs.json"; }
          cluster=$(out ClusterName)
          task=$(aws ecs run-task --cluster "$cluster" --task-definition "$(out ReleaseTaskDefinitionArn)" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(out TaskSubnetIds)],securityGroups=[$(out TaskSecurityGroupId)],assignPublicIp=ENABLED}" \
            --started-by "deploy-$GITHUB_RUN_ID" --query 'tasks[0].taskArn' --output text)
          echo "Release task $task. Log: /primolar/api, stream primolar-api-release/release/${task##*/}"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$code" = "0" || { echo "::error::The release task exited $code: migrations failed and the services were NOT updated. Read its log, then runbooks/rollback.md."; exit 1; }

      - name: Update the services to the new image
        working-directory: packages/infra
        run: >-
          pnpm exec cdk deploy "$SERVICE_STACK" --exclusively --require-approval never
          --parameters "$SERVICE_STACK:ReleaseImageTag=${{ steps.tag.outputs.tag }}"
          --parameters "$SERVICE_STACK:ImageTag=${{ steps.tag.outputs.tag }}"
