# A weekly dependency audit, so a new high or critical advisory in what production runs shows up without waiting
# for a push. The same check as api.yml's audit job (pnpm run audit:deps = pnpm audit --prod --audit-level high).
name: audit
on:
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (09:17 Manila)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0, version from package.json's packageManager
      # No `cache: pnpm`: this job installs nothing (see api.yml's audit job).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
