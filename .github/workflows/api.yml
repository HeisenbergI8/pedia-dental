# The closing gate and the integration suite, on the MySQL version production runs (8.4); B13a adds the schema drift
# check, the dependency audit and the image build.
name: check
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pedia_dental_test
          MYSQL_USER: pedia
          MYSQL_PASSWORD: pedia
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # `prisma generate` (postinstall) reads DATABASE_URL through prisma.config.ts.
      DATABASE_URL: mysql://pedia:pedia@127.0.0.1:3307/pedia_dental_test
      TEST_DATABASE_URL: mysql://pedia:pedia@127.0.0.1:3307/pedia_dental_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter api test:int
      # B13a: a schema change without its migration (or a hand-edited migration) fails here.
      - name: Schema drift
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS pedia_dental_shadow"
          pnpm --filter api db:drift
        env:
          SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3307/pedia_dental_shadow

  # B13a: high-severity advisories in what production runs. Dev-only tools are out of scope (--prod).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm run audit:deps

  # B13a: the image builds, runs as non-root, its release step migrates a fresh database, and it serves its probes.
  image:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pedia_dental_release
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: primolar-api:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as non-root
        run: test "$(docker run --rm primolar-api:ci id -u)" != "0"
      - name: Release step migrates a fresh database
        run: docker run --rm --network host -e DATABASE_URL=mysql://root:root@127.0.0.1:3307/pedia_dental_release primolar-api:ci node_modules/.bin/prisma migrate deploy
      - name: Serves its probes
        run: |
          docker run -d --name api --network host -e DATABASE_URL=mysql://root:root@127.0.0.1:3307/pedia_dental_release primolar-api:ci
          curl --retry 15 --retry-connrefused --retry-delay 2 -fsS http://127.0.0.1:4100/api/health/live
          curl -fsS http://127.0.0.1:4100/api/health/ready
      - if: failure()
        run: docker logs api || true
