# The closing gate and the integration suite, on the MySQL version production runs (8.4); B13a adds the schema drift
# check, the dependency audit and the image build.
name: check
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pedia_dental_test
          MYSQL_USER: pedia
          MYSQL_PASSWORD: pedia
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # `prisma generate` (postinstall) reads DATABASE_URL through prisma.config.ts.
      DATABASE_URL: mysql://pedia:pedia@127.0.0.1:3307/pedia_dental_test
      TEST_DATABASE_URL: mysql://pedia:pedia@127.0.0.1:3307/pedia_dental_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0, version from package.json's packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter api test:int
      # B13a: a schema change without its migration (or a hand-edited migration) fails here.
      - name: Schema drift
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS pedia_dental_shadow"
          pnpm --filter api db:drift
        env:
          SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3307/pedia_dental_shadow

  # B13a: high-severity advisories in what production runs. Dev-only tools are out of scope (--prod).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No `cache: pnpm`: this job installs nothing, so the cache's post step finds no store to save and fails.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm run audit:deps

  # B13a: the image builds, runs as non-root, its release step migrates a fresh database, and it serves its probes.
  image:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pedia_dental_release
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          tags: primolar-api:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as non-root
        run: test "$(docker run --rm primolar-api:ci id -u)" != "0"
      - name: Release step migrates a fresh database
        run: docker run --rm --network host -e DATABASE_URL=mysql://root:root@127.0.0.1:3307/pedia_dental_release primolar-api:ci node_modules/.bin/prisma migrate deploy
      # Finding #22: started without its hosted settings, the image refuses to start (exit 1, not a timeout).
      - name: Fails closed without its settings
        run: |
          set +e
          timeout 60 docker run --rm --network host -e DATABASE_URL=mysql://root:root@127.0.0.1:3307/pedia_dental_release primolar-api:ci
          code=$?
          test "$code" -ne 0 && test "$code" -ne 124
      # The image defaults to APP_ENV=production, which refuses dev defaults, so the probe run gets hosted-looking
      # settings. Nothing calls S3 or the web origin here, and no background work runs.
      - name: Serves its probes
        run: |
          docker run -d --name api --network host -e DATABASE_URL=mysql://root:root@127.0.0.1:3307/pedia_dental_release \
            -e CORS_ORIGIN=https://ci.example.test -e WEB_URL=https://ci.example.test -e S3_BUCKET=primolar-ci-unused \
            -e ORIGIN_SECRET=ci-origin-secret-not-used-anywhere-else-0000 -e BACKGROUND_WORK=false primolar-api:ci
          curl --retry 15 --retry-connrefused --retry-delay 2 -fsS http://127.0.0.1:4100/api/health/live
          curl -fsS http://127.0.0.1:4100/api/health/ready
      - if: failure()
        run: docker logs api || true

  # GCP migration: the Terraform files parse, are formatted, and every reference resolves. Offline from Google
  # Cloud (-backend=false): no state, no credentials. Applying is the owner's, by hand.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
